[package]
name = "kbwrite"
version = "0.5.0"
edition = "2021"
description = "A local-first knowledge base. React and BlockNote in a Tauri shell, with markdown notes on disk."
license = "MIT"
repository = "https://github.com/zetahiveco/kbwrite"
homepage = "https://kbwrite.ink"
keywords = ["notes", "knowledge-base", "tauri", "obsidian", "editor"]
categories = ["text-editors"]

[lib]
name = "kbwrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
