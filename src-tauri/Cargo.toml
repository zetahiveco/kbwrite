[package]
name = "kbwrite"
version = "0.8.0"
edition = "2021"
description = "A local-first knowledge base. React and BlockNote in a Tauri shell, with markdown notes on disk."
license = "MIT"
repository = "https://github.com/zetahiveco/kbwrite"
homepage = "https://kbwrite.ink"
keywords = ["notes", "knowledge-base", "tauri", "obsidian", "editor"]
categories = ["text-editors"]

[lib]
name = "kbwrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
kbwrite-plugin = { path = "plugin-api" }
libloading = "0.8"
toml = "0.8"
ureq = "2"
zip = ">=2.2, <2.6"
